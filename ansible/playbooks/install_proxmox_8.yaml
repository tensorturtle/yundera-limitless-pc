# This Ansible playbook installs the no-subscription version of Proxmox VE 8 on Debian 12 Bookworm
# Reference: https://pve.proxmox.com/wiki/Install_Proxmox_VE_on_Debian_12_Bookworm
---
- name: Install Proxmox VE 8 with dynamic hostname & public IP
  hosts: all
  become: true
  tasks:
    - name: Set hostname fact
      command: hostname
      register: hostname_output

    - name: Fetch remote public IP from ident.me
      uri:
        url: https://ident.me
        return_content: yes
      register: public_ip

    - name: Set public IP fact
      set_fact:
        ip_address: "{{ public_ip.content }}"

    - name: Display gathered information
      debug:
        msg: "Hostname: {{ hostname_output.stdout }}, Public IP: {{ ip_address }}"

    - name: Configure /etc/hosts file (inline version)
      copy:
        dest: /etc/hosts
        owner: root
        group: root
        mode: '0644'
        content: |
          127.0.0.1   localhost
          {{ ip_address }}   {{ hostname_output.stdout }} {{ hostname_output.stdout }}

          # The following lines are desirable for IPv6 capable hosts
          ::1     localhost ip6-localhost ip6-loopback
          ff02::1 ip6-allnodes
          ff02::2 ip6-allrouters

    - name: Add Proxmox VE 8 repository to sources list
      copy:
        dest: /etc/apt/sources.list.d/pve-install-repo.list
        content: 'deb [arch=amd64] http://download.proxmox.com/debian/pve bookworm pve-no-subscription'
        owner: root
        group: root
        mode: '0644'

    - name: Download Proxmox GPG key to trusted.gpg.d
      get_url:
        url: https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg
        dest: /etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg
        mode: '0644'
        owner: root
        group: root

    - name: Update apt cache and perform full upgrade
      apt:
        update_cache: yes
        upgrade: full

    - name: Install Proxmox VE default kernel
      apt:
        name: proxmox-default-kernel
        state: present
        update_cache: yes

    - name: Reboot the server to apply Proxmox kernel
      reboot:
        reboot_timeout: 600
        test_command: whoami

    - name: Remove Proxmox enterprise repository file if it exists
      file:
        path: /etc/apt/sources.list.d/pve-enterprise.list
        state: absent
        

    - name: Install Proxmox VE packages (VE, Postfix, Open-iSCSI, Chrony)
      apt:
        name:
          - proxmox-ve
          - postfix
          - open-iscsi
          - chrony
        state: present
        update_cache: yes

    - name: Remove default Debian kernel to prevent conflicts
      apt:
        name:
          - linux-image-amd64
          - 'linux-image-6.1*'
        state: absent
        purge: yes
        autoremove: yes
        force: yes

    - name: Update GRUB configuration
      command: update-grub

    - name: Remove os-prober package
      apt:
        name: os-prober
        state: absent

    - name: Remove Proxmox paid enterprise repository
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/pve-enterprise.list
        state: absent
    

